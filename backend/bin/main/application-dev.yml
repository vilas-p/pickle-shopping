spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: dev-only-admin-jwt-secret-32-chars-minimum
  customer-jwt:
    secret: dev-only-customer-jwt-secret-32-chars
  otp:
    expose-debug-code: true

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
