spring:
  jpa:
    show-sql: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.appaamma: INFO

app:
  otp:
    expose-debug-code: false
  notification:
    sms:
      provider: ${APP_NOTIFICATION_SMS_PROVIDER:MSG91}
    whatsapp:
      provider: ${APP_NOTIFICATION_WHATSAPP_PROVIDER:WHATSAPP_BUSINESS_API}
    email:
      provider: ${APP_NOTIFICATION_EMAIL_PROVIDER:RESEND}
